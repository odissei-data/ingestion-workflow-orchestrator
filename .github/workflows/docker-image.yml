name: Docker Image CI

on:
  push:
    tags:
      - "*"

env:
  SERVER_IMAGE: ghcr.io/odissei-data/prefect
  WORKER_IMAGE: ghcr.io/odissei-data/prefect-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Prefect Server Image
        id: server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest

      - name: Build and push Prefect Worker Image
        id: worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
            ${{ env.WORKER_IMAGE }}:latest

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "Images:"
            echo "- \`$SERVER_IMAGE:$TAG@$SERVER_DIGEST\`"
            echo "- \`$WORKER_IMAGE:$TAG@$WORKER_DIGEST\`"
            echo
            git log --no-merges --format='%x01- %s (%h)%n%b' "${prev:+$prev..}$TAG" |
              awk '/^\001/ {print substr($0, 2); next} /^BREAKING[ -]CHANGE: / {print "  " $0}'
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
